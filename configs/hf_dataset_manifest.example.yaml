# Copy to hf_dataset_manifest.yaml (local only). Edit `src` to your absolute paths.
# `dest` is relative to the staging root (Hub repo layout).
#
# Rules:
# - Prefer genesis_data for test* if that is the collaborator “full” copy.
# - Prefer project dataset/ for train* (and mirrors when genesis is unavailable on this node).
# - Skip or comment any entry whose src does not exist on the upload machine.

version: 1

entries:
  # --- Friction relative ---
  - dest: friction/relative/train
    src: /work/guanqi/proj5/Inferring_dynamic_physics/dataset/friction_relative/5.24_friction_synthetic_train
  - dest: friction/relative/test1
    src: /work/guanqi/proj5/Inferring_dynamic_physics/dataset/friction_relative/5.24_friction_synthetic_test1
  - dest: friction/relative/test2
    src: /scratch/shared/beegfs/guanqi/genesis_data/5.24_friction_synthetic_test2
  - dest: friction/relative/test3
    src: /scratch/shared/beegfs/guanqi/genesis_data/7.18_friction_test3_rgb_seg_videos_152frames_relative_test

  # --- Friction absolute (train from zip; stage_hf_dataset.py extracts .zip into dest) ---
  - dest: friction/absolute/train
    src: /work/guanqi/proj5/Inferring_dynamic_physics/dataset/friction_absolute/4.29_friction_synthetic_train.zip
  - dest: friction/absolute/test1
